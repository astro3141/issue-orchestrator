# Self-hosting configuration — astro3141/issue-orchestrator fork
#
# Deliberately a NAMED config, not default.yaml and not a merge into main.yaml:
# main.yaml is upstream-owned and stays checked in as the upstream reference.
#
# This file is this fork's CANONICAL GUARDRAIL SELECTION. scripts/verify-pr.sh
# is generated from it, so one identity is used everywhere:
#
#   orchestrator runtime   --config .../modes/default/selfhost.yaml
#   agent sessions         ISSUE_ORCHESTRATOR_CONFIG_* exported from that run
#   human push fallback    baked into scripts/verify-pr.sh
#
# An earlier revision of this comment said the named config existed to avoid
# rewriting the tracked verify-pr.sh. That is no longer why: the fork now
# regenerates it deliberately, so a push with no runtime selection gates
# against the contract this repository actually runs rather than upstream's.
#
# Select this file explicitly:
#
#   ISSUE_ORCHESTRATOR_CONFIG_NAME=selfhost.yaml
#
# SELF-HOSTING BOUNDARY
#
# A trusted pinned runtime orchestrates this repository as a candidate. The
# candidate's own (possibly modified) IO source never runs itself. Moving that
# pin is a separate decision, taken only after a PR passes independent review
# and the publish gate, and followed by its own canary run.
#
# The current pin and the promotion procedure live in issue #18, "The
# boundary": https://github.com/astro3141/issue-orchestrator/issues/18

repo:
  name: astro3141/issue-orchestrator
  github:
    api_url: https://api.github.com
    http_timeout_seconds: 20

default_agent:
  provider: claude-code
  model: opus

agents:
  agent:backend:
    prompt: .prompts/backend.md
    provider: claude-code
    ai_system: claude-code
    model: opus
    timeout_minutes: 300
    reviewer: agent:reviewer
    provider_args:
      permission_mode: bypassPermissions
  agent:reviewer:
    prompt: .prompts/code-review.md
    provider: claude-code
    ai_system: claude-code
    model: opus
    timeout_minutes: 60
    provider_args:
      permission_mode: bypassPermissions

worktrees:
  base: /Users/astro3141/io-fork-worktrees
  base_branch_override: main
  seed_ref: origin/main
  reuse_push_preflight: true
  worktree_branch_on_recreate: delete
  # This fork's publish gate is `make validate-pr-raw`, whose last target is
  # `test-vscode`; its quick gate runs `.venv/bin/python` and `make typecheck`,
  # and `quality-guardrails` needs `.venv-semgrep`. None of that is created by
  # creating a worktree, so with no setup declared here every worktree reached
  # validation missing prerequisites and the resulting failure was recorded
  # against the candidate commit (#48). `make worktree-setup` is the target
  # that installs them, and it is what main.yaml and z-codespaces.yaml already
  # declare.
  #
  # It is idempotent in *result*, not free: `venv-fast` reuses an existing
  # `.venv` and `playwright install` skips satisfied browsers, but `npm ci`
  # deletes `packages/vscode/node_modules` and reinstalls from the lockfile on
  # every invocation by design. That fixed cost is now paid on all five session
  # launch paths, not just coding and validation retry.
  #
  # It syncs the worktree's *own* `.venv`. It used to sync the repository's,
  # because worktree creation symlinked `.venv` to it — which meant every
  # provisioning run repointed the shared environment's editable install at the
  # worktree being provisioned, and removing that worktree left the primary
  # checkout unable to import the package (#53). Worktrees no longer share an
  # environment; see `docs/architecture/validation.md`.
  setup:
    - make worktree-setup
  remediation:
    pr_collision: new_branch
    push_rebase_retry: true

security:
  # HUMAN-A APPROVED REPOSITORY-ROOT WORKSPACE TRUST (#215).
  #
  # The scoped security decision is #204's Human-A grant, comment 5385523051:
  # ONE absolute repository root, approved for the managed checkout this fork
  # orchestrates. It is recorded here — in the operator-owned engine config,
  # under version control — because that makes it durable, reviewable, and
  # identifiable: a launch's evidence names this document and a fingerprint of
  # the bytes it was read from.
  #
  # It is deliberately an absolute path and not "the current repository". A
  # travelling grant (cwd, repo root walk, the running orchestrator's own
  # checkout) would widen itself to whatever checkout executed it. Concretely:
  # the recovery checkout at /Users/astro3141/io-recovery/issue-orchestrator
  # runs this same config and is granted NOTHING by it, because its worktrees
  # resolve to a different common repository root.
  #
  # A Codex launch materializes this per launch, as one root-command
  # `-c projects={ "<root>" = { trust_level = "trusted" } }` override — nothing
  # is written to the operator's ~/.codex/config.toml, and the grant's lifetime
  # is the launch. Removing the key does not "open up" anything: absent = deny,
  # and an interactive Codex launch then fails closed before spawn.
  workspace_trust:
    approved_repository_root: /Users/astro3141/io-fork/issue-orchestrator

execution:
  concurrency:
    max_concurrent_sessions: 1
    session_timeout_minutes: 300
  session_interactions:
    enabled: true
  isolation:
    mode: standard

review:
  enabled: true
  default: agent:reviewer
  # Raised from 1 for issue #6. The first rework round was spent on a review
  # that had not yet stated the requirement properly: it asked for the hidden
  # work to be preserved but not for the check to precede the destructive step,
  # nor for the regression test to drive the production create_worktree/reuse
  # path instead of the internal helper. The agent addressed what was asked.
  # This is a changed requirement, not the same defect twice, so one more
  # automatic round is warranted. Repeated failure against the *same* stated
  # requirement still escalates.
  max_rework_cycles: 2

validation:
  # No locale workaround lives here. One upstream test asserts on English git
  # stderr, so the orchestrator runtime must be started with LC_MESSAGES=C;
  # that is a self-hosting environment requirement, recorded outside the repo,
  # not something this config or any tracked source should carry.
  quick:
    # Narrow so rework rounds stay short; whole-repository regression duty
    # belongs to publish. Narrow is only legitimate while the selection still
    # covers the change under review — a `passed=true` that deselected every
    # test the change added is evidence about somebody else's code. Keep the
    # keywords ahead of the work: the gate and dirty-guard terms below exist
    # because #6 touches worktree setup, planted CLI tools, and dirty-tree
    # classification, and the next issue elsewhere in the tree must add its
    # own before relying on this profile.
    #
    # #15 (exact-SHA review verdict binding) added the four terms after
    # `worktree`: `review_verdict` and `review_exchange_records` reach the
    # binding's own suites, `review_artifacts` reaches the decision-approval
    # tests, and `Verdict` reaches `TestExactShaVerdictBinding`, whose module
    # name carries none of the others.
    #
    # #22 (Codex home isolation) added `codex_home`. Without it exactly one of
    # the change's ~30 tests was selected — `profile` happened to match a single
    # provisioning case — and the integration proof that the guard actually
    # fails a leaking test was deselected entirely. `codex_home` reaches both
    # `tests/unit/test_codex_home_isolation.py` and
    # `tests/integration/test_codex_home_isolation.py`.
    #
    # #22 rework also added `packages/agent_runner/tests` to the paths. The
    # isolation fixtures register in the repository-root `conftest.py` so they
    # reach both declared testpaths, and the test proving the second root is
    # guarded has to live in that root — a path list of `tests/…` alone cannot
    # select it. Naming both roots in one invocation also keeps the repository
    # the rootdir, which is what makes the root `conftest.py` apply at all.
    #
    # #25 (the publish gate must execute `validation.publish.cmd`) added
    # `publication`, `publish`, `contract` and `gate`. Its central regression
    # module — `test_publication_gate.py` — and the completion-processor cases
    # that pin which completions are held to the publish contract match none
    # of the terms above, so the profile would have reported `passed=true`
    # having deselected every test the change added.
    # #25 also adjusted one simulated-scenario assertion; the
    # simulated suite stays out of this profile's paths on purpose (it is slow
    # and rework rounds must stay short) and is covered by publish, which runs
    # `make validate-pr-raw`.
    #
    # #34 (orchestrator-observed actor/reviewer execution identity) added
    # `execution_identity`, `ExecutionIdentity` and `attempt`. Its three new
    # suites and the durability proof carry none of the terms above:
    # `execution_identity` reaches `test_execution_identity.py` and
    # `test_attempt_execution_identity_store.py`, `ExecutionIdentity` reaches
    # `TestCandidateExecutionIdentityBinding` inside
    # `test_persistent_session_exchange.py` (whose module name matches none of
    # the keywords), and `attempt` reaches the attempt-record and sidecar-store
    # tests the evidence is stored through. Widening only.
    #
    # Merging #22 into post-#25 `main` unions the two selectors rather than
    # letting either win: the paths take `packages/agent_runner/tests` from #22
    # on top of #25's two, and the keyword list takes both `codex_home` and
    # #25's four gate terms. Widen-only — no term either branch relied on was
    # dropped, and `--collect-only` was used to confirm both changes' tests are
    # still selected after the merge.
    cmd: ".venv/bin/python -m pytest tests/unit tests/integration packages/agent_runner/tests -q --tb=short -p no:cacheprovider -k 'validation or profile or config or prepush or planted or cli_tools or dirty or worktree or review_verdict or review_exchange_records or review_artifacts or Verdict or codex_home or publication or publish or contract or gate or execution_identity or ExecutionIdentity or attempt' && make typecheck"
    timeout_seconds: 1800
  publish:
    # The upstream project's own gate, reproduced rather than invented:
    # main.yaml sets publish to `make validate-pr-raw`, which already runs
    # typecheck, lint-arch, lint-complexity, test-unit, test-simulated-core,
    # test-integration-core-local, test-simulated-agent and test-vscode. Adding
    # typecheck or lint-arch here would duplicate them.
    #
    # tests/e2e is intentionally absent: it is a separate live contract needing
    # gh auth and E2E_TEST_REPO, and with that variable unset the fixtures fall
    # back to the current git repo (tests/e2e/fixtures/github_utils.py:140) and
    # write issues into this fork. Upstream CI does not run it either. Run live
    # E2E separately against a throwaway E2E_TEST_REPO.
    #
    # LIVE-AGENT SEGREGATION IS NOW IN THE SELECTOR, NOT IN AN OVERRIDE (#194).
    # Between the Human-A decision and this landing, the engine pinned a
    # temporary `PYTEST='... --deselect <nodeid> --deselect <nodeid>'` override
    # here, from the primary checkout, so a migration candidate could not define
    # and then pass its own gate. That bootstrap is spent: `validate-pr-raw` no
    # longer reaches a single live-agent test. Blocking targets deselect the
    # `live_agent` MARKER, the way they already deselected `live_codex`, and
    # `test-live-assurance` — which is in no blocking phase — owns those tests.
    # Removing the override changes nothing about what runs; it stops two places
    # stating the same rule.
    #
    # #227 COMPLETES THAT: "the way they already deselected `live_codex`" was
    # true of the selector and false of the graph. `validate-pr-raw`'s live-web
    # phase named `test-integration-core-live-codex` directly, so the real Codex
    # CLI ran on every candidate anyway — and one failed publication on
    # `prompt_not_accepted` after 120s idle, with nothing of its own at fault.
    # That phase is web-only now. `validate-pr-raw` reaches no live-provider
    # target at all; the Codex smoke is `make test-integration-core-live-codex`,
    # run deliberately, and its result carries no publication authority.
    cmd: "make validate-pr-raw"
    timeout_seconds: 5400

retry:
  max_validation_retries: 2
  validation_error_file: validation-errors.txt

labels:
  in_progress: in-progress
  blocked: blocked
  needs_human: needs-human
  needs_rework: needs-rework
  validation_failed: validation-failed

tech_lead:
  # Requirements for #3 are already fixed by the human operator; no task
  # discovery or contract authoring is delegated.
  enabled: false

filtering:
  fetch_limit: 100
  max_to_start: 0
